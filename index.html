<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>FIRST BLAST</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>
  <div id="start" class="panel"><h1>FIRST <span>BLAST</span></h1><p>小さなアリーナでロボットと対決しよう！</p><button id="startButton">BLAST OFF</button><small>WASD 移動 / マウス 視点 / クリック 射撃 / Space ジャンプ / Shift ダッシュ / R リロード</small></div>
  <div id="hud" class="hidden">
    <div class="brand">FIRST <b>BLAST</b></div><div class="score">撃破 <b id="kills">0</b> / 5　 敗北 <b id="deaths">0</b> / 5</div>
    <div id="crosshair"><i></i><i></i></div><div id="hitmarker">×</div>
    <div class="health"><label>HP <b id="hpText">200</b></label><div><i id="hpBar"></i></div></div>
    <div class="ammo"><span>PULSE BLASTER</span><b id="ammo">20</b><small id="reloadText"></small></div>
  </div>
  <div id="mobile" class="hidden"><div id="stick"><i></i></div><div id="look"></div><button id="fire">射撃</button><button id="jump">JUMP</button><button id="dash">DASH</button></div>
  <div id="message" class="panel hidden"><h1 id="result">Victory!</h1><p id="resultDetail"></p><button id="again">もう一度遊ぶ</button></div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js"}}</script>
  <script type="module" src="main.js"></script>
</body></html>
